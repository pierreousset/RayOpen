name: macOS build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build macOS
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build application
        run: ./scripts/build-app.sh
      - name: Validate bundle
        run: plutil -lint dist/RayOpen.app/Contents/Info.plist
